<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2液配合・希釈計算</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #f5f5f5;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  color: #222;
}

.card {
  max-width: 520px;
  margin: 0 auto;
  background: #fff;
  border-radius: 18px;
  padding: 24px;
  box-shadow: 0 4px 18px rgba(0,0,0,.08);
}

h1 {
  text-align: center;
  font-size: 24px;
  margin: 0 0 24px;
}

label {
  display: block;
  font-weight: 700;
  margin: 16px 0 7px;
}

input {
  width: 100%;
  padding: 13px;
  font-size: 18px;
  border: 1px solid #ccc;
  border-radius: 10px;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: #222;
  color: #fff;
  font-size: 18px;
  font-weight: 700;
}

.result {
  display: none;
  margin-top: 24px;
  padding: 18px;
  background: #f7f7f7;
  border-radius: 14px;
}

.row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid #ddd;
}

.row:last-child {
  border-bottom: none;
  font-weight: 700;
}

.note {
  margin-top: 14px;
  font-size: 13px;
  color: #666;
}
</style>
</head>

<body>

<div class="card">

<h1>2液配合・希釈計算</h1>

<label for="total">仕上がり総量（g）</label>
<input id="total" type="number" min="0" step="0.1" placeholder="例：1500">

<label for="dilution">シンナー希釈率（%）</label>
<input id="dilution" type="number" min="0" step="0.1" placeholder="例：800">

<button onclick="calculate()">計算する</button>

<div class="result" id="result">

  <div class="row">
    <span>主材</span>
    <span id="main">0 g</span>
  </div>

  <div class="row">
    <span>硬化剤</span>
    <span id="hardener">0 g</span>
  </div>

  <div class="row">
    <span>シンナー</span>
    <span id="thinner">0 g</span>
  </div>

  <div class="row">
    <span>合計</span>
    <span id="finalTotal">0 g</span>
  </div>

</div>

<div class="note">
主材：硬化剤 ＝ 2：1<br>
希釈率は「主材＋硬化剤」に対するシンナーの割合です。
</div>

</div>

<script>
function fmt(n) {
  return Number(n.toFixed(2)).toLocaleString('ja-JP');
}

function calculate() {

  const total = Number(document.getElementById('total').value);
  const dilution = Number(document.getElementById('dilution').value);

  if (!total || total <= 0 || dilution < 0) {
    alert('数値を入力してください。');
    return;
  }

  // 希釈率を小数に変換
  const rate = dilution / 100;

  // 総量 = 主材＋硬化剤＋シンナー
  // シンナー = (主材＋硬化剤) × 希釈率
  const base = total / (1 + rate);

  // 主材：硬化剤 = 2：1
  const main = base * 2 / 3;
  const hardener = base / 3;

  // シンナー
  const thinner = base * rate;

  // 表示
  document.getElementById('main').textContent =
    fmt(main) + ' g';

  document.getElementById('hardener').textContent =
    fmt(hardener) + ' g';

  document.getElementById('thinner').textContent =
    fmt(thinner) + ' g';

  document.getElementById('finalTotal').textContent =
    fmt(main + hardener + thinner) + ' g';

  document.getElementById('result').style.display = 'block';
}
</script>

</body>
</html>
